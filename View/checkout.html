<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <link rel="stylesheet" href="../styles/common.css">
    <link rel="stylesheet" href="../styles/layout.css">

    <style>
        .checkout-container {
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            background: #f8f8f8;
            border-radius: 10px;
            text-align: center;
        }

        .summary {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .confirm-btn {
            padding: 12px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .confirm-btn:hover {
            background: #555;
        }
    </style>
</head>
<body>

<main>
    <div class="checkout-container">
        <h1>Checkout</h1>

        <div class="summary">
            Your total is: <strong>$0.00</strong>
        </div>

        <button class="confirm-btn" onclick="confirmPurchase()">
            Confirm Purchase
        </button>
    </div>
</main>

<script>
    function confirmPurchase() {
        alert("Purchase confirmed!");
    }
</script>

</body>
</html>
