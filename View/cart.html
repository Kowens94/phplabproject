<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>

    <link rel="stylesheet" href="../styles/common.css">
    <link rel="stylesheet" href="../styles/layout.css">

    <style>
        .cart-container {
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            background: #f8f8f8;
            border-radius: 10px;
            text-align: center;
        }

        .cart-total {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .buy-btn {
            padding: 12px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .buy-btn:hover {
            background: #555;
        }

        .checkout-link {
            display: block;
            margin-top: 20px;
            font-size: 1rem;
            color: #333;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

<main>
    <div class="cart-container">
        <h1>Your Cart</h1>

        <div class="cart-total">
            Cart Total: $0.00
        </div>


        <button class="buy-btn" onclick="goCheckout()">Buy Now</button>

        <div class="checkout-link" onclick="goCheckout()">
            Go to Checkout Page
        </div>
    </div>
</main>

<script>
    function goCheckout() {
        parent.document.getElementById("storeFrame").src = "./View/checkout.html";
    }
</script>

</body>
</html>
